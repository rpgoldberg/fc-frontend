---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fc-frontend-policy
  namespace: figurecollecting
spec:
  podSelector:
    matchLabels:
      app: fc-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Traefik ingress controller (kube-system namespace)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow egress to fc-backend
    - to:
        - podSelector:
            matchLabels:
              app: fc-backend
      ports:
        - protocol: TCP
          port: 5050
